
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport"
 content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>像素冒險 Online</title>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#17231f;color:#fff;
font-family:system-ui;text-align:center}
main{max-width:600px;margin:auto;padding:14px}
h2{color:#a8f0a0}
button,input{font-size:16px;padding:11px;border-radius:9px;
border:0;margin:4px}
button{background:#a8f0a0;color:#17231f;font-weight:bold}
input{width:145px;max-width:45%;background:#fff}
#status{color:#ffe28a;min-height:28px}
canvas{display:block;width:100%;height:auto;
border:3px solid #a8f0a0;border-radius:10px;
background:#6ebd66;touch-action:none}
.controls{display:grid;grid-template-columns:repeat(3,60px);
justify-content:center;gap:5px;margin:12px}
.controls button{height:52px;font-size:22px;margin:0}
.small{font-size:13px;color:#c9d8d0}
</style>
</head>
<body>
<main>
<h2>🌳 像素冒險 Online</h2>
<p>建立房間，邀請朋友一起冒險！</p>
<div>
<button id="hostBtn">建立房間</button>
</div>
<p>朋友的房間代碼：</p>
<input id="room" placeholder="輸入房間代碼">
<button id="joinBtn">加入房間</button>
<p id="status">尚未連線</p>
<p>你的代碼：<b id="myid">尚未建立</b></p>
<button id="copyBtn">複製我的代碼</button>
<canvas id="game" width="480" height="360"></canvas>
<div class="controls">
 <span></span><button data-dir="up">▲</button><span></span>
 <button data-dir="left">◀</button>
 <button data-dir="down">▼</button>
 <button data-dir="right">▶</button>
</div>
<p class="small">電腦：方向鍵或 WASD　手機：按住方向鍵移動</p>
<p class="small">原型測試版：房主需要保持遊戲開啟。</p>
</main>
<script>
const $=id=>document.getElementById(id);
const canvas=$("game"),ctx=canvas.getContext("2d");
const W=480,H=360;
let peer=null,host=false,hostConn=null;
let conns=[],players={};
let myId="",x=100,y=100;
let keys={},touch={},lastSend=0;
const colors=["#ffdc62","#ff8b83","#8bd7ff",
"#d8a0ff","#ffffff","#ffa85c"];

function say(s){$("status").textContent=s}
function newPlayer(id,px,py){
 return {x:px,y:py,color:colors[
  Object.keys(players).length%colors.length]};
}
function startPeer(){
 if(peer)peer.destroy();
 peer=new Peer();
 peer.on("open",id=>{
  myId=id;$("myid").textContent=id;
  say("已準備好！可以邀請朋友。");
 });
 peer.on("error",e=>say("連線錯誤："+e.type));
 peer.on("connection",conn=>{
  if(!host){conn.close();return}
  setupHostConnection(conn);
 });
}
function setupHostConnection(conn){
 conns.push(conn);
 conn.on("open",()=>{
  players[conn.peer]=newPlayer(conn.peer,240,180);
  conn.send({type:"welcome",players});
  say("有玩家加入！目前 "+(conns.length+1)+" 人");
 });
 conn.on("data",msg=>{
  if(msg.type==="pos"&&players[conn.peer]){
   players[conn.peer].x=msg.x;
   players[conn.peer].y=msg.y;
  }
 });
 conn.on("close",()=>{
  delete players[conn.peer];
  conns=conns.filter(c=>c!==conn);
 });
}
$("hostBtn").onclick=()=>{
 host=true;x=100;y=100;players={};
 say("正在建立房間...");
 startPeer();
};
$("joinBtn").onclick=()=>{
 const id=$("room").value.trim();
 if(!id)return say("請輸入朋友的房間代碼。");
 host=false;
 say("正在連線...");
 startPeer();
 const wait=setInterval(()=>{
  if(!peer||!peer.open)return;
  clearInterval(wait);
  hostConn=peer.connect(id,{reliable:true});
  hostConn.on("open",()=>say("連線成功！開始冒險吧！"));
  hostConn.on("data",msg=>{
   if(msg.type==="welcome"||msg.type==="state"){
    players=msg.players||{};
   }
  });
  hostConn.on("close",()=>say("與房主的連線已中斷"));
 },200);
};
$("copyBtn").onclick=async()=>{
 if(!myId)return say("請先建立房間。");
 try{
  await navigator.clipboard.writeText(myId);
  say("代碼已複製，可以傳給朋友。");
 }catch(e){
  say("請長按上方代碼自行複製。");
 }
};

function move(dx,dy){
 x=Math.max(12,Math.min(W-12,x+dx));
 y=Math.max(12,Math.min(H-12,y+dy));
}
function loop(t){
 let dx=0,dy=0;
 if(keys.ArrowUp||keys.w||touch.up)dy=-2.5;
 if(keys.ArrowDown||keys.s||touch.down)dy=2.5;
 if(keys.ArrowLeft||keys.a||touch.left)dx=-2.5;
 if(keys.ArrowRight||keys.d||touch.right)dx=2.5;
 if(dx&&dy){dx*=0.707;dy*=0.707}
 move(dx,dy);

 if(host&&peer&&peer.open){
  players[myId]={x,y,color:colors[0]};
  if(t-lastSend>100){
   conns.forEach(c=>{
    if(c.open)c.send({type:"state",players});
   });
   lastSend=t;
  }
 }else if(hostConn&&hostConn.open&&t-lastSend>70){
  hostConn.send({type:"pos",x,y});
  lastSend=t;
 }
 draw();
 requestAnimationFrame(loop);
}
function draw(){
 ctx.clearRect(0,0,W,H);
 ctx.fillStyle="#75c86a";ctx.fillRect(0,0,W,H);
 ctx.fillStyle="#61b45b";
 for(let i=0;i<12;i++){
  for(let j=0;j<9;j++){
   if((i*7+j*3)%4===0)
    ctx.fillRect(i*40+4,j*40+4,20,14);
  }
 }
 // 小路
 ctx.fillStyle="#d9c48a";
 ctx.fillRect(0,275,W,34);
 ctx.fillRect(215,0,34,H);
 // 樹木
 for(const [tx,ty] of [[45,45],[420,65],[400,230],[65,210]]){
  ctx.fillStyle="#704b30";ctx.fillRect(tx+10,ty+15,8,17);
  ctx.fillStyle="#277d43";ctx.beginPath();
  ctx.arc(tx+14,ty+12,15,0,Math.PI*2);ctx.fill();
 }
 // 其他玩家
 for(const [id,p] of Object.entries(players)){
  if(id===myId)continue;
  character(p.x,p.y,p.color||"#ff8b83");
  ctx.fillStyle="#fff";ctx.font="11px sans-serif";
  ctx.textAlign="center";ctx.fillText("朋友",p.x,p.y-19);
 }
 character(x,y,colors[0]);
 ctx.fillStyle="#17351d";ctx.font="bold 12px sans-serif";
 ctx.textAlign="center";ctx.fillText("你",x,y-19);
}
function character(px,py,color){
 ctx.fillStyle="#31543a";ctx.fillRect(px-9,py+7,18,5);
 ctx.fillStyle=color;ctx.fillRect(px-9,py-10,18,18);
 ctx.fillStyle="#fff";ctx.fillRect(px-5,py-5,4,4);
 ctx.fillRect(px+2,py-5,4,4);
 ctx.fillStyle="#69432d";ctx.fillRect(px-7,py+8,5,7);
 ctx.fillRect(px+2,py+8,5,7);
}
document.addEventListener("keydown",e=>{
 if(["ArrowUp","ArrowDown","ArrowLeft","ArrowRight"," "].includes(e.key))
  e.preventDefault();
 keys[e.key]=true;
});
document.addEventListener("keyup",e=>keys[e.key]=false);
document.querySelectorAll("[data-dir]").forEach(btn=>{
 const d=btn.dataset.dir;
 const on=e=>{e.preventDefault();touch[d]=true};
 const off=e=>{e.preventDefault();touch[d]=false};
 btn.addEventListener("pointerdown",on);
 btn.addEventListener("pointerup",off);
 btn.addEventListener("pointercancel",off);
 btn.addEventListener("pointerleave",off);
});
requestAnimationFrame(loop);
</script>
</body>
</html>
