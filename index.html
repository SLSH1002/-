
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport"
 content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>像素冒險 Online</title>

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<style>
*{box-sizing:border-box}
body{
 margin:0;background:#17231f;color:#fff;
 font-family:system-ui;text-align:center
}
main{max-width:600px;margin:auto;padding:14px}
h2{color:#a8f0a0}
button,input{
 font-size:16px;padding:11px;border-radius:9px;
 border:0;margin:4px
}
button{
 background:#a8f0a0;color:#17231f;font-weight:bold;
 cursor:pointer
}
input{
 width:145px;max-width:45%;background:#fff
}
#status{color:#ffe28a;min-height:28px;overflow-wrap:anywhere}
#roomCodeDisplay{
 font-size:30px;letter-spacing:5px;color:#a8f0a0
}
#qrCode{
 display:flex;justify-content:center;align-items:center;
 margin:12px auto;min-height:0
}
#qrCode img,#qrCode canvas{
 margin:auto;border:8px solid white;border-radius:4px
}
canvas#game{
 display:block;width:100%;height:auto;
 border:3px solid #a8f0a0;border-radius:10px;
 background:#6ebd66;touch-action:none
}
.controls{
 display:grid;grid-template-columns:repeat(3,60px);
 justify-content:center;gap:5px;margin:12px
}
.controls button{height:52px;font-size:22px;margin:0}
.small{font-size:13px;color:#c9d8d0}
</style>
</head>

<body>
<main>
<h2>🌳 像素冒險 Online</h2>
<p>建立房間，邀請朋友一起冒險！</p>

<div>
 <button id="hostBtn">建立房間</button>
</div>

<p>你的四位房間代碼：</p>
<div id="roomCodeDisplay">----</div>

<div id="qrCode"></div>
<p class="small">朋友掃描 QR Code 開啟遊戲，再按加入房間。</p>
<button id="copyBtn">複製房間代碼</button>

<hr style="border-color:#40564a;margin:18px 0">

<p>輸入朋友的四位房間代碼：</p>
<input id="room" placeholder="例如 A7K2"
 maxlength="4" autocomplete="off" autocapitalize="characters">
<button id="joinBtn">加入房間</button>

<p id="status">尚未連線</p>

<canvas id="game" width="480" height="360"></canvas>

<div class="controls">
 <span></span><button data-dir="up">▲</button><span></span>
 <button data-dir="left">◀</button>
 <button data-dir="down">▼</button>
 <button data-dir="right">▶</button>
</div>

<p class="small">電腦：方向鍵或 WASD　手機：按住方向鍵移動</p>
<p class="small">房主必須保持遊戲開啟。網路連線需正常才能一起遊玩。</p>
</main>

<script>
const $ = id => document.getElementById(id);
const canvas = $("game");
const ctx = canvas.getContext("2d");
const W = 480, H = 360;

// 每個四位房間碼對應一個 PeerJS ID
const ROOM_PREFIX = "pixel-rpg-";

let peer = null;
let host = false;
let hostConn = null;
let conns = [];
let players = {};
let myId = "";
let roomCode = "";
let x = 100, y = 100;
let keys = {}, touch = {};
let lastSend = 0;
let joining = false;

const colors = [
 "#ffdc62","#ff8b83","#8bd7ff",
 "#d8a0ff","#ffffff","#ffa85c"
];

function say(s) {
 $("status").textContent = s;
}

function generateRoomCode() {
 const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
 let code = "";
 for (let i = 0; i < 4; i++) {
  code += chars[Math.floor(Math.random() * chars.length)];
 }
 return code;
}

function showRoomCode(code) {
 $("roomCodeDisplay").textContent = code;

 const qr = $("qrCode");
 qr.innerHTML = "";

 // QR Code 包含遊戲網址及房間碼
 const inviteUrl =
  location.origin + location.pathname + "?room=" + code;

 if (typeof QRCode === "undefined") {
  say("QR Code 載入失敗，請重新整理頁面。");
  return;
 }

 new QRCode(qr, {
  text: inviteUrl,
  width: 200,
  height: 200,
  colorDark: "#17231f",
  colorLight: "#ffffff",
  correctLevel: QRCode.CorrectLevel.M
 });
}

function newPlayer(id, px, py) {
 return {
  x: px,
  y: py,
  color: colors[Object.keys(players).length % colors.length]
 };
}

function startHostRoom() {
 if (peer) {
  peer.destroy();
  peer = null;
 }

 host = true;
 joining = false;
 hostConn = null;
 conns = [];
 players = {};
 x = 100;
 y = 100;
 myId = "";

 $("hostBtn").disabled = true;
 $("joinBtn").disabled = false;
 $("roomCodeDisplay").textContent = "....";
 $("qrCode").innerHTML = "";

 let attempts = 0;

 function createPeerWithCode() {
  attempts++;
  if (attempts > 15) {
   $("hostBtn").disabled = false;
   say("暫時無法建立房間，請再試一次。");
   return;
  }

  roomCode = generateRoomCode();
  say("正在建立房間 " + roomCode + " ...");

  peer = new Peer(ROOM_PREFIX + roomCode);

  peer.on("open", id => {
   myId = id;
   players = {};
   players[myId] = {
    x, y, color: colors[0]
   };

   showRoomCode(roomCode);
   say("房間已建立！把代碼或 QR Code 分享給朋友。");
   $("hostBtn").disabled = false;
  });

  peer.on("connection", conn => {
   if (!host) {
    conn.close();
    return;
   }
   setupHostConnection(conn);
  });

  peer.on("error", e => {
   console.error("PeerJS error:", e);

   if (e.type === "unavailable-id") {
    // 房間碼被其他人使用，換一組再試
    if (peer) {
     peer.destroy();
     peer = null;
    }
    createPeerWithCode();
   } else {
    say("連線錯誤：" + e.type + "。請重新建立房間。");
    $("hostBtn").disabled = false;
   }
  });
 }

 createPeerWithCode();
}

function setupHostConnection(conn) {
 if (conns.some(c => c.peer === conn.peer)) return;

 conns.push(conn);

 conn.on("open", () => {
  players[conn.peer] = newPlayer(conn.peer, 240, 180);

  conn.send({
   type: "welcome",
   players
  });

  say("有玩家加入！目前 " + (conns.length + 1) + " 人");
 });

 conn.on("data", msg => {
  if (!msg || typeof msg !== "object") return;

  if (msg.type === "pos" && players[conn.peer]) {
   // 避免不合法座標
   if (Number.isFinite(msg.x) && Number.isFinite(msg.y)) {
    players[conn.peer].x = Math.max(12, Math.min(W - 12, msg.x));
    players[conn.peer].y = Math.max(12, Math.min(H - 12, msg.y));
   }
  }
 });

 conn.on("close", () => {
  delete players[conn.peer];
  conns = conns.filter(c => c !== conn);
  say("有玩家離開房間。");
 });

 conn.on("error", e => {
  console.error("玩家連線錯誤：", e);
 });
}

$("hostBtn").onclick = () => {
 startHostRoom();
};

$("joinBtn").onclick = () => {
 const code = $("room").value.trim().toUpperCase();

 if (!/^[A-Z0-9]{4}$/.test(code)) {
  say("請輸入四位英數字房間碼。");
  return;
 }

 if (peer) {
  peer.destroy();
  peer = null;
 }

 host = false;
 joining = true;
 hostConn = null;
 conns = [];
 players = {};
 myId = "";
 roomCode = code;

 $("room").value = code;
 $("joinBtn").disabled = true;
 say("正在加入房間 " + code + " ...");

 peer = new Peer();

 peer.on("open", id => {
  myId = id;
  hostConn = peer.connect(ROOM_PREFIX + code, {
   reliable: true
  });

  let gotWelcome = false;

  hostConn.on("open", () => {
   say("已連線，正在取得玩家資料...");
  });

  hostConn.on("data", msg => {
   if (!msg || typeof msg !== "object") return;

   if (msg.type === "welcome" || msg.type === "state") {
    if (msg.players && typeof msg.players === "object") {
     players = msg.players;
     gotWelcome = true;

     if (msg.type === "welcome") {
      say("加入成功！開始冒險吧！");
     }
    }
   }
  });

  hostConn.on("close", () => {
   say("與房主的連線已中斷。");
   $("joinBtn").disabled = false;
  });

  hostConn.on("error", e => {
   console.error("Host connection error:", e);
   say("連線失敗，請確認房間碼及房主是否在線。");
   $("joinBtn").disabled = false;
  });

  // 若連線已打開但一直沒有收到房間資料，
  // 交由狀態同步或錯誤訊息繼續處理。
 });

 peer.on("error", e => {
  console.error("PeerJS error:", e);
  say("加入失敗：" + e.type + "。請確認房間碼及網路。");
  $("joinBtn").disabled = false;
 });

 // 確保連線失敗時不會一直鎖住按鈕
 setTimeout(() => {
  if (joining && (!hostConn || !hostConn.open)) {
   $("joinBtn").disabled = false;
  }
 }, 12000);
};

$("copyBtn").onclick = async () => {
 if (!roomCode || !host) {
  say("請先建立房間，才能複製房間代碼。");
  return;
 }

 try {
  await navigator.clipboard.writeText(roomCode);
  say("房間代碼 " + roomCode + " 已複製！");
 } catch (e) {
  // 部分手機或非 HTTPS 環境不允許剪貼簿操作
  $("room").value = roomCode;
  $("room").select();
  say("請複製選取的房間代碼：" + roomCode);
 }
};

function move(dx, dy) {
 x = Math.max(12, Math.min(W - 12, x + dx));
 y = Math.max(12, Math.min(H - 12, y + dy));
}

function loop(t) {
 let dx = 0, dy = 0;

 if (keys.ArrowUp || keys.w || keys.W || touch.up) dy = -2.5;
 if (keys.ArrowDown || keys.s || keys.S || touch.down) dy = 2.5;
 if (keys.ArrowLeft || keys.a || keys.A || touch.left) dx = -2.5;
 if (keys.ArrowRight || keys.d || keys.D || touch.right) dx = 2.5;

 if (dx && dy) {
  dx *= 0.707;
  dy *= 0.707;
 }

 move(dx, dy);

 if (host && peer && peer.open) {
  players[myId] = {
   x, y, color: colors[0]
  };

  if (t - lastSend > 100) {
   conns.forEach(c => {
    if (c.open) {
     c.send({ type: "state", players });
    }
   });
   lastSend = t;
  }
 } else if (hostConn && hostConn.open && t - lastSend > 70) {
  hostConn.send({ type: "pos", x, y });
  lastSend = t;
 }

 draw();
 requestAnimationFrame(loop);
}

function draw() {
 ctx.clearRect(0, 0, W, H);

 ctx.fillStyle = "#75c86a";
 ctx.fillRect(0, 0, W, H);

 ctx.fillStyle = "#61b45b";
 for (let i = 0; i < 12; i++) {
  for (let j = 0; j < 9; j++) {
   if ((i * 7 + j * 3) % 4 === 0) {
    ctx.fillRect(i * 40 + 4, j * 40 + 4, 20, 14);
   }
  }
 }

 // 小路
 ctx.fillStyle = "#d9c48a";
 ctx.fillRect(0, 275, W, 34);
 ctx.fillRect(215, 0, 34, H);

 // 樹木
 for (const [tx, ty] of [[45,45],[420,65],[400,230],[65,210]]) {
  ctx.fillStyle = "#704b30";
  ctx.fillRect(tx + 10, ty + 15, 8, 17);
  ctx.fillStyle = "#277d43";
  ctx.beginPath();
  ctx.arc(tx + 14, ty + 12, 15, 0, Math.PI * 2);
  ctx.fill();
 }

 // 其他玩家
 for (const [id, p] of Object.entries(players)) {
  if (id === myId) continue;

  character(p.x, p.y, p.color || "#ff8b83");
  ctx.fillStyle = "#fff";
  ctx.font = "11px sans-serif";
  ctx.textAlign = "center";
  ctx.fillText("朋友", p.x, p.y - 19);
 }

 character(x, y, colors[0]);
 ctx.fillStyle = "#17351d";
 ctx.font = "bold 12px sans-serif";
 ctx.textAlign = "center";
 ctx.fillText("你", x, y - 19);
}

function character(px, py, color) {
 ctx.fillStyle = "#31543a";
 ctx.fillRect(px - 9, py + 7, 18, 5);

 ctx.fillStyle = color;
 ctx.fillRect(px - 9, py - 10, 18, 18);

 ctx.fillStyle = "#fff";
 ctx.fillRect(px - 5, py - 5, 4, 4);
 ctx.fillRect(px + 2, py - 5, 4, 4);

 ctx.fillStyle = "#69432d";
 ctx.fillRect(px - 7, py + 8, 5, 7);
 ctx.fillRect(px + 2, py + 8, 5, 7);
}

// 掃描邀請 QR Code 後，自動填入房間碼
const params = new URLSearchParams(location.search);
const invitedRoom = params.get("room");

if (invitedRoom && /^[A-Z0-9]{4}$/i.test(invitedRoom)) {
 $("room").value = invitedRoom.toUpperCase();
 say("已填入邀請房間碼，按「加入房間」即可。");
}

document.addEventListener("keydown", e => {
 if (["ArrowUp","ArrowDown","ArrowLeft","ArrowRight"," "].includes(e.key)) {
  e.preventDefault();
 }
 keys[e.key] = true;
});

document.addEventListener("keyup", e => {
 keys[e.key] = false;
});

document.querySelectorAll("[data-dir]").forEach(btn => {
 const d = btn.dataset.dir;

 const on = e => {
  e.preventDefault();
  touch[d] = true;
 };

 const off = e => {
  e.preventDefault();
  touch[d] = false;
 };

 btn.addEventListener("pointerdown", on);
 btn.addEventListener("pointerup", off);
 btn.addEventListener("pointercancel", off);
 btn.addEventListener("pointerleave", off);
});

requestAnimationFrame(loop);
</script>
</body>
</html>
